<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt Circle Level</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .circle {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(30,58,138,0.4) 100%);
            border: 4px solid rgba(96, 165, 250, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 35px rgba(0,0,0,0.6), 0 0 30px rgba(59,130,246,0.5);
            overflow: hidden;
            cursor: pointer;
        }
        .ball {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.95), inset -6px -6px 15px rgba(0,0,0,0.2);
            transition: transform 0.05s linear;
        }
    </style>
</head>
<body onclick="requestSensors()">
    <div class="circle">
        <div id="ball" class="ball"></div>
    </div>

    <script>
        const maxTilt = 30;

        function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response == 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        window.addEventListener('load', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        });

        function handleOrientation(event) {
            let beta = event.beta;
            let gamma = event.gamma;

            if (beta === null || gamma === null) return;

            let clampedGamma = Math.max(-maxTilt, Math.min(maxTilt, gamma));
            let clampedBeta = Math.max(-maxTilt, Math.min(maxTilt, beta));

            // රවුම විශාල වී ඇති නිසා බෝලය චලනය වන දුර ප්‍රමාණය (Range) සකස් කර ඇත
            let x = (clampedGamma / maxTilt) * 110; 
            let y = (clampedBeta / maxTilt) * 110;

            let ball = document.getElementById('ball');
            ball.style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>
</body>
</html>
