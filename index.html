<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt Circle</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        .circle {
            position: relative;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(30,58,138,0.4) 100%);
            border: 4px solid rgba(96, 165, 250, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6), 0 0 35px rgba(59,130,246,0.5);
            overflow: hidden;
        }
        .ball {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.95), inset -6px -6px 15px rgba(0,0,0,0.2);
            transform: translate(0px, 0px);
            will-change: transform;
        }
    </style>
</head>
<body>
    <div class="circle">
        <div id="ball" class="ball"></div>
    </div>

    <script>
        const maxTilt = 30;
        const ball = document.getElementById('ball');

        // තිරය ස්පර්ශ කළ වහාම සෙන්සර් අවසර ඉල්ලීම සහ සක්‍රීය වීම
        document.body.addEventListener('click', initSensors, { once: true });
        document.body.addEventListener('touchstart', initSensors, { once: true });

        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }

        function handleOrientation(event) {
            let beta = event.beta;   // ඉදිරියට/පස්සට ඇලවීම
            let gamma = event.gamma; // වමට/දකුණට ඇලවීම

            if (beta === null || gamma === null) return;

            let clampedGamma = Math.max(-maxTilt, Math.min(maxTilt, gamma));
            let clampedBeta = Math.max(-maxTilt, Math.min(maxTilt, beta));

            let x = (clampedGamma / maxTilt) * 120; 
            let y = (clampedBeta / maxTilt) * 120;

            ball.style.transform = `translate(${x}px, ${y}px)`;
        }
    </script>
</body>
</html>
